name: in-three

services:
  snapchain:
    image: farcasterxyz/snapchain:0.14.3@sha256:fa9c9de2fb5205680ef8dbfd29e42dd60c889bcaff57589c9bb7a66d59fb9694
    init: true
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/opt/in-three/snapchain-entrypoint.sh"]
    environment:
      RUST_BACKTRACE: "1"
      ONCHAIN_CONFIG_ENABLED: "false"
    ports:
      - "127.0.0.1:3381:3381/tcp"
      - "3382:3382/udp"
      - "127.0.0.1:3383:3383/tcp"
    volumes:
      - /srv/in-three/data/rocks:/app/.rocks
      - /srv/in-three/data/snapshot:/app/.rocks.snapshot
      - ./validators.toml:/opt/in-three/validators.toml:ro
      - ./snapchain-entrypoint.sh:/opt/in-three/snapchain-entrypoint.sh:ro
      - ./snapchain-healthcheck.sh:/opt/in-three/snapchain-healthcheck.sh:ro
    networks: [protocol, node-egress]
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "/opt/in-three/snapchain-healthcheck.sh"]
      interval: 30s
      timeout: 8s
      retries: 10
      start_period: 24h

  client:
    image: in-three-client:local
    build:
      context: ./source
      dockerfile: apps/client/Dockerfile
    restart: unless-stopped
    env_file:
      - ./client.env
    depends_on:
      snapchain:
        condition: service_healthy
    networks: [protocol, web]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

  deployer:
    image: in-three-client:local
    command: ["node", "dist/server/deployment-service.js"]
    restart: unless-stopped
    environment:
      DEPLOYMENT_PORT: "3335"
      IN_THREE_DEPLOY_ROOT: /app/deploy
      IN_THREE_DEPLOY_STATE_ROOT: /var/lib/in-three-deployer
    networks: [deployment, deployer-egress]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    volumes:
      - /srv/in-three/data/deployer:/var/lib/in-three-deployer
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3335/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 15s

  agent-gateway:
    image: in-three-client:local
    command: ["node", "dist/server/agent-gateway.js"]
    restart: unless-stopped
    env_file:
      - path: ./agent-gateway.env
        required: false
    depends_on:
      client:
        condition: service_started
      deployer:
        condition: service_healthy
    networks: [web, deployment]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3334/agent/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 15s

  caddy:
    image: caddy:2.10.2-alpine@sha256:d8c17a862962def15cde69863a3a463f25a2664942eafd7bdbf050e9c3116b83
    restart: unless-stopped
    environment:
      CLIENT_DOMAIN: "${CLIENT_DOMAIN}"
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/in-three/data/caddy-data:/data
      - /srv/in-three/data/caddy-config:/config
    depends_on:
      client:
        condition: service_started
    networks: [web]
    security_opt:
      - no-new-privileges:true

networks:
  protocol:
    internal: true
  deployment:
    internal: true
  deployer-egress:
  node-egress:
  web:
