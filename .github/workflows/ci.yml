name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check && npm run build

      - name: Verify prebuilt npm package
        run: |
          mkdir -p /tmp/in-three-pack /tmp/in-three-prefix /tmp/in-three-workspace
          npm pack --ignore-scripts --pack-destination /tmp/in-three-pack
          package_tarball="$(find /tmp/in-three-pack -name 'farcaster-in-three-*.tgz' -print -quit)"
          tar -tzf "$package_tarball" | grep -q 'package/apps/client/dist/server/setup.js'
          tar -tzf "$package_tarball" | grep -q 'package/apps/client/dist/web/index.html'
          npm install --global --prefix /tmp/in-three-prefix "$package_tarball"
          cd /tmp/in-three-workspace
          test "$(/tmp/in-three-prefix/bin/in-three --version)" = "0.1.0"
          /tmp/in-three-prefix/bin/in-three --help | grep -q 'in-three provision'
          test ! -e .state

      - name: Audit production and development dependencies
        run: npm audit --audit-level=moderate

      - name: Parse shell entrypoints
        run: bash -n farcaster scripts/*.sh scripts/lib/common.sh deploy/snapchain-entrypoint.sh

      - name: Validate Compose model
        run: |
          mkdir -p deploy/source
          touch deploy/client.env deploy/validators.toml
          printf 'CLIENT_DOMAIN=example.invalid\n' > deploy/.env
          docker compose -f deploy/docker-compose.yml config --quiet
