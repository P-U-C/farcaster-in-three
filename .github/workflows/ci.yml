name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check && npm run build

      - name: Verify prebuilt npm package
        run: |
          expected_version="$(node -p 'require("./package.json").version')"
          mkdir -p /tmp/in-three-pack /tmp/in-three-prefix /tmp/in-three-workspace
          npm pack --ignore-scripts --pack-destination /tmp/in-three-pack
          package_tarball="$(find /tmp/in-three-pack -name 'farcaster-in-three-*.tgz' -print -quit)"
          tar -tzf "$package_tarball" > /tmp/in-three-package-files
          grep -Fxq 'package/apps/client/dist/server/setup.js' /tmp/in-three-package-files
          grep -Fxq 'package/apps/client/dist/web/index.html' /tmp/in-three-package-files
          npm install --global --prefix /tmp/in-three-prefix "$package_tarball"
          cd /tmp/in-three-workspace
          test "$(/tmp/in-three-prefix/bin/in-three --version)" = "$expected_version"
          /tmp/in-three-prefix/bin/in-three --help | grep -q 'in-three provision'
          test ! -e .state

      - name: Audit production and development dependencies
        run: npm audit --audit-level=moderate

      - name: Parse shell entrypoints
        run: bash -n farcaster container-entrypoint in-three-container scripts/*.sh scripts/lib/common.sh deploy/snapchain-entrypoint.sh

      - name: Validate Compose models
        run: |
          mkdir -p deploy/source
          touch deploy/client.env deploy/validators.toml
          printf 'CLIENT_DOMAIN=example.invalid\n' > deploy/.env
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f in-three.compose.yml config --quiet

      - name: Build and exercise the operator image
        run: |
          expected_version="$(node -p 'require("./package.json").version')"
          docker build --file Dockerfile.operator --tag in-three-operator:test .
          test "$(docker run --rm in-three-operator:test --version)" = "$expected_version"
          docker run --rm in-three-operator:test doctor
