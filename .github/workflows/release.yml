name: Publish prebuilt CLI and containers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify tag and package
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          npm run check
          npm run build
          node scripts/verify-package.mjs

      - name: Build release assets
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          cd release
          sha256sum farcaster-in-three-*.tgz > "farcaster-in-three-${GITHUB_REF_NAME#v}.tgz.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "In Three $GITHUB_REF_NAME" \
            --notes "Prebuilt npm CLI plus checksummed linux/amd64 and linux/arm64 Docker images for macOS and Linux hosts. The small in-three-container launcher downloads, verifies, and loads the correct image. Operational state stays in the mounted working directory."

  container:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the operator image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir release-container
          tar_path="release-container/farcaster-in-three-container-${version}-linux-${ARCH}.tar"
          docker buildx build \
            --file Dockerfile.operator \
            --platform "linux/${ARCH}" \
            --build-arg "VERSION=${version}" \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "puc/farcaster-in-three:${version}" \
            --cache-from type=gha,scope="operator-${ARCH}" \
            --cache-to type=gha,mode=max,scope="operator-${ARCH}" \
            --output "type=docker,dest=${tar_path}" \
            .
          gzip -9 "${tar_path}"
          cd release-container
          sha256sum "farcaster-in-three-container-${version}-linux-${ARCH}.tar.gz" \
            > "farcaster-in-three-container-${version}-linux-${ARCH}.tar.gz.sha256"

      - name: Verify the release image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="release-container/farcaster-in-three-container-${version}-linux-${ARCH}.tar.gz"
          docker load --input "$asset"
          test "$(docker run --rm --platform "linux/${ARCH}" "puc/farcaster-in-three:${version}" --version)" = "${version}"
          docker run --rm --platform "linux/${ARCH}" "puc/farcaster-in-three:${version}" doctor

      - name: Publish the release image
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release-container/* --clobber
